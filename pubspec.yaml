name: jdonuts
description: "J'Donuts app"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  intl: ^0.20.3
  injectable: ^3.0.0
  dio: ^5.11.1
  talker_dio_logger: ^5.2.0
  shared_preferences: ^2.5.6
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^17.3.0
  top_snackbar_flutter: ^3.5.0
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  flutter_secure_storage: ^11.2.0
  retrofit: ^4.10.0
  pinput: ^5.0.2
  flutter_svg: ^2.3.2
  flutter_animate: ^4.5.2
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  connectivity_plus: ^7.3.2
  cached_network_image: ^4.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  icons_launcher: ^3.1.0
  flutter_flavorizr: ^2.6.0
  build_runner: ^2.16.1
  injectable_generator: ^3.1.3
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  retrofit_generator: ^10.3.3
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/auth/donuts/
    - assets/images/auth/patterns/
    - assets/images/auth/socials/
    - assets/images/home/
    - assets/images/tiers/
    - assets/seed/
    - assets/seed/images/

  fonts:
    - family: General Sans
      fonts:
        - asset: assets/fonts/GeneralSans-Light.otf
          weight: 300
        - asset: assets/fonts/GeneralSans-Regular.otf
          weight: 400
        - asset: assets/fonts/GeneralSans-Medium.otf
          weight: 500
        - asset: assets/fonts/GeneralSans-Semibold.otf
          weight: 600
        - asset: assets/fonts/GeneralSans-Bold.otf
          weight: 700
    - family: Menco
      fonts:
        - asset: assets/fonts/Menco-Light.otf
          weight: 300
        - asset: assets/fonts/Menco-Medium.otf
          weight: 500
        - asset: assets/fonts/Menco-Bold.otf
          weight: 700
        - asset: assets/fonts/Menco-Black.otf
          weight: 900
    - family: Noto Sans Myanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansMyanmar-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansMyanmar-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansMyanmar-Bold.ttf
          weight: 700
