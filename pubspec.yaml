name: jdonuts
description: "J'Donuts app"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  intl: ^0.20.3
  injectable: ^3.0.0
  dio: ^5.11.1
  talker_dio_logger: ^5.2.0
  shared_preferences: ^2.5.6
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^17.3.0
  top_snackbar_flutter: ^3.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  icons_launcher: ^3.1.0
  flutter_flavorizr: ^2.6.0
  build_runner: ^2.16.1
  injectable_generator: ^3.1.3
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Noto Sans Myanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansMyanmar-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansMyanmar-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansMyanmar-Bold.ttf
          weight: 700
